name: Sync Upstream

on:
  schedule:
    # 每天 UTC 01:00 (北京时间 09:00) 同步上游
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: custom-dependencies
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/jxxghp/MoviePilot.git || true
          git fetch upstream

      - name: Check for upstream changes
        id: check
        run: |
          LOCAL=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/main)
          if [ "$LOCAL" = "$UPSTREAM" ]; then
            echo "No upstream changes detected"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Upstream changes detected"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Merge upstream changes
        if: steps.check.outputs.changed == 'true'
        run: |
          # 合并上游更改，保留我们的更改
          git merge upstream/main --no-edit --strategy-option=ours || {
            echo "Merge conflict detected, resolving..."
            # 如果有冲突，优先保留我们的更改
            git add .
            git commit --no-edit --allow-empty
          }

      - name: Push changes
        if: steps.check.outputs.changed == 'true'
        run: |
          git push origin custom-dependencies
